<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenGauge Configurator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1><span class="wordmark">OpenGauge</span> <span class="page-title">Configurator</span></h1><p>Local prototype. Preview images use the production C++ renderer.</p></header>
  <main>
    <section class="toolbar">
      <button id="save">Save local config</button><button id="download">Download JSON</button>
      <label class="upload">Upload JSON<input id="upload" type="file" accept="application/json"></label>
      <button id="restore">Restore default</button>
    </section>
    <p id="message" role="status"></p>
    <section id="editor-view">
      <div class="columns">
        <details class="section-accordion" open>
          <summary>Data sources <span id="source-count" class="count"></span></summary>
          <div class="accordion-content"><div id="sources"></div><button id="add-source">Add source</button></div>
        </details>
        <details class="section-accordion" open>
          <summary>Gauge screens <span id="gauge-count" class="count"></span></summary>
          <div class="accordion-content"><div id="gauges"></div><button id="add-gauge">Add gauge</button></div>
        </details>
      </div>
      <details class="section-accordion raw-json">
        <summary>Raw JSON</summary>
        <div class="accordion-content"><textarea id="raw" spellcheck="false"></textarea><button id="apply-raw">Apply JSON</button></div>
      </details>
    </section>
    <section class="preview"><h2>Exact preview</h2><label>Gauge <select id="preview-gauge"></select></label><div id="samples"></div><button id="render">Render PNG</button><p>Grey marks pixels outside the physical round LCD.</p><img id="preview-image" alt="Gauge preview"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
