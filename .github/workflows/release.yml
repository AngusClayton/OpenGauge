name: Release OpenGauge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio run
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      - run: bash tools/wasm/build_wasm.sh
      - run: node tools/wasm/smoke_test.mjs
      - run: pio run --target buildfs
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          build='.pio/build/waveshare_esp32s3_touch_lcd_128'
          framework="$HOME/.platformio/packages/framework-arduinoespressif32"
          mkdir -p dist/package
          cp "$build/bootloader.bin" dist/package/bootloader.bin
          cp "$build/partitions.bin" dist/package/partitions.bin
          cp "$framework/tools/partitions/boot_app0.bin" dist/package/boot_app0.bin
          cp "$build/firmware.bin" dist/package/firmware.bin
          cp "$build/littlefs.bin" dist/package/littlefs.bin
          python "$HOME/.platformio/packages/tool-esptoolpy/esptool.py" \
            --chip esp32s3 merge_bin \
            -o dist/package/opengauge-factory.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 dist/package/bootloader.bin \
            0x8000 dist/package/partitions.bin \
            0xe000 dist/package/boot_app0.bin \
            0x10000 dist/package/firmware.bin \
            0x910000 dist/package/littlefs.bin
          cp tools/configurator/web/opengauge-renderer.js dist/package/
          cp tools/configurator/web/opengauge-renderer.wasm dist/package/
          cp tools/web-installer/manifest.json dist/package/
          cp README.md LICENSE dist/package/
          (cd dist/package && sha256sum *.bin *.js *.wasm > SHA256SUMS.txt)
          (cd dist/package && zip -9 ../opengauge-${GITHUB_REF_NAME}.zip ./*)
          cp dist/package/{bootloader,partitions,boot_app0,firmware,littlefs,opengauge-factory}.bin dist/
          cp dist/package/SHA256SUMS.txt dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/opengauge-${{ github.ref_name }}.zip
            dist/bootloader.bin
            dist/partitions.bin
            dist/boot_app0.bin
            dist/firmware.bin
            dist/littlefs.bin
            dist/opengauge-factory.bin
            dist/SHA256SUMS.txt
