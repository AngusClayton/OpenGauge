name: Feature request
description: Propose a focused OpenGauge improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem that the feature must solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the firmware, web UI, preview, or hardware change.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and safety impact
      description: List JSON, hardware, vehicle, or migration effects.
